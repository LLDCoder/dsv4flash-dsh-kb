capability: admin-portal-reader
portal: admin
mode: assistant-readonly

filter_evidence_contract:
  viewport: A stable 1920x1080 desktop viewport avoids accidentally selecting a collapsed responsive filter surface.
  controls: Bounded visible labels, selected values, native options and narrow observed locators; inspect at most four Ant combobox option popups without selecting values, and close them with Escape; never sensitive fields.
  metrics: Bind numeric values to local label siblings, never neighboring flattened page text.
  execution: Select an exact option for input comboboxes, verify selected values, and apply documented inline or overlay filters.
  result: Real rows must also satisfy explicit user conditions; a default bounded sample cannot establish an empty filtered result.
  recovery: A literal user condition matching one unique observed option in an identified search/filter surface can produce one generic filter read; arbitrary form controls never qualify. Otherwise request one bounded semantic correction. Never infer an Apply click merely from a Filter button, which may open additional filters.
  native_rows: A hidden excluded operation column must not discard visible native data columns; ambiguous data-column spans remain rejected.
  consistency: Compare table fingerprints before and after bounded collection; retry changing tables, and never return mixed old/new rows or infer emptiness from an unstable observation.
  literal_guard: Uses one unambiguous label observed in controls or metrics, with no domain status dictionary; complex or implicit predicates remain semantic planning responsibilities.
  safety: Existing identity, route, business-mutation and sensitive-field restrictions remain in force.

routing:
  default_skill: admin_portal_reader
  retained_skills:
    - admin_portal_reader
    - general_knowledge
  removed_behavior:
    - module_skill_routing
    - business_domain_recall
    - keyword_skill_selection
    - module_workflow_dispatch
    - business_tool_fallback

admin_portal_reader:
  purpose: Answer Admin Portal questions from the current user's authorized page view and the knowledge-base user manual.
  allowed_tools:
    - knowledge.search
    - admin.portal.read
  execution_order:
    - get_user_info
    - resolve_conditional_follow_up_intent_before_retrieval
    - retrieve_relevant_manual
    - plan_bounded_page_read
    - select_and_open_authorized_candidate_page
    - discover_relevant_page_operations
    - conditionally_drill_once
    - select_currently_selectable_operation_key
    - bind_selected_operation_to_page_generated_evidence
    - reduce_to_relevant_facts
  first_release_coverage:
    - dashboard
    - licensing_tasks
    - licensing_profile_verification
    - licensing_licenses
    - licensing_reports_analytics
    - licensing_team_management
  coverage_boundary:
    included_modules: [Dashboard, Licensing, Customer Happiness, Content, Inspection, Finance]
    licensing_inventory: [Applications, Profile Verification, Licenses, Reports & Analytics, Team Management]
    licensing_scan_evidence: doc/admin-portal-reader/licensing-coverage.yaml
    basic_module_evidence: doc/admin-portal-reader/business-pilot-2026-09-06/results.md
    improvement_scan_policy:
      dashboard_and_licensing: reuse_existing_complete_scan_evidence
      full_rescan: not_required
      targeted_rescan: only_when_the_affected_page_or_control_boundary_cannot_be_confirmed_from_existing_evidence
    manual_publication_and_live_reader_acceptance: user_reports_basic_v1_uploaded_representative_retrieval_checked_business_pilots_in_progress
    reports_export_results: outside_readonly_boundary
    future_business_modules: out_of_scope
  limits:
    max_pages: 3
    max_actions: 12
    max_duration_seconds: 90
    portal_execution_timeout_seconds: 45
    max_facts: 20
    max_fact_characters: 500
    max_missing_items: 10
    max_result_characters: 12000
    maxCandidatesBeforeDrill: 10
    maxDrillDepth: 1

manual_semantic_contract:
  purpose: Define the minimum business semantics that a retrievable page-region manual node must provide; the manual remains in the knowledge base.
  required_fields:
    section: Stable visible region name.
    page: Permitted route or page identity.
    type: Semantic kind such as summary, metric, list, filter surface, or read-only detail.
    meaning: What the region represents in business terms.
    use_when: User intents for which this region is authoritative.
    distinguish_from: Similar regions that must not be substituted and the business difference.
    content: Visible fields or summaries the region can support.
    scope: How personal, team, global, or unknown scope is established from GetUserInfo and current page evidence.
  optional_fields:
    - default_state
    - time_semantics
    - role_differences
    - empty_state
    - applicability
    - entry_conditions
    - alternate_sources
  requirements:
    - A node must be self-contained enough to choose the correct page region from one bounded knowledge retrieval.
    - Manuals describe business semantics and visible control behavior, not answer templates or regression assertions.
    - Manuals must not contain dynamic counts, account data, credentials, cookies, tokens, brittle selectors, or undocumented backend identifiers.
    - Independently retrievable semantic nodes are peers; controls belong directly to their node, without a nested page-tree dependency.
    - Alternate sources are valid only when business object, ownership, filters, time scope, and answer shape match; explicit page requests remain authoritative.

conversation_context_contract:
  purpose: Preserve the minimum prior-turn meaning needed to resolve an elliptical follow-up without passing the full conversation to the Reader.
  answer_shape:
    enum: [overview, count, list, attention, due, detail, unspecified]
  resolved_intent:
    relations: [continue, refine, switch, broaden, clarify]
    slots: [businessObject, businessFocus, recordIdentity, view, dateRange, filter, requestedScope, answerShape]
    per_slot_sources: [current, previous, clear, unspecified]
    source_evidence: bounded_exact_text_from_current_question_or_previous_semantic_anchors
    authority: intent_only_never_permissions_or_live_facts
    max_resolution_seconds: 20
    total_reader_budget: unchanged
    syntax_and_schema_attempts: 2
    completion_review_attempts: 1
    clarification_options: exactly_two_plain_scope_labels_only_when_materially_ambiguous
  allowed_fields:
    - prior_question
    - answer_shape
    - category
    - page
    - section
    - result_status
    - record_identity_reference
    - recent_intents
  requirements:
    - The current question remains authoritative; context may fill an omitted answer shape or category but must not override an explicit current request.
    - Context is bounded, sanitized, and derived only from the immediately relevant prior user question and Reader result.
    - After resolution, only resolved conditions and a compatible bounded source hint enter retrieval and every planning pass; raw history and prior page restrictions do not. The two actual clarification labels may accompany a resolved selection to interpret an ordinal, never as filters or permissions.
    - Business focus is independent of answer shape; asking for a list of the discussed attention subset preserves that subset without treating historical counts as current rows.
    - Unspecified means omitted, not removed. Within continue or refine, omitted known conditions are retained; explicit clear requires evidence from the current question. Legacy empty-clear slots are treated as omissions.
    - Switch and broaden do not inherit omitted conditions or old narrow business focus. A compatible source hint is a candidate entry only, never a required route or permission grant.
    - Human-readable verified section names may establish focus; technical observation IDs, assistant prose, and prior rows may not.
    - Planning uses a canonical resolved task while retaining originalQuestion for literal constraints; it must not reinterpret a resolved ordinal as missing history.
    - Page and section come from a prior verified Reader result, never from an assistant claim alone.
    - Context contains no full transcript, page payload, record table, identity credential, cookie, token, or hidden field.
    - Answer-shape continuity is generic and must not introduce module-specific runtime routing.
    - At most three recent user-turn boundaries may contribute intent metadata; event count is not a turn boundary.
    - A bounded record identifier from an observed list or detail is a reference for a fresh lookup, not proof that prior status or ownership remains current.
    - A failed page read retains resolved noncleared intent; explicitly cleared slots and resolver-failure boundaries must not resurrect older anchors.
    - A successful single-fact detail or explicitly requested one-record list may establish a newly observed identity; a broad list never selects its first record implicitly.
    - Elliptical requests for live lists or records still require a fresh read; a manual definition is not a substitute.
    - Current answer shape must be satisfied, not copied onto an ordinary result; deterministic attention fallback requires an observed attention or action-review section.
    - Clarification returns not_confirmed with intent_ambiguous and guarded localized alternatives; it performs no knowledge or page query.

page_api_discovery_contract:
  purpose: Discover the read operations causally associated with one selected authorized page, then let the Reader select an operation without creating a business-specific Tool.
  page_selection:
    inputs: [current_question, resolved_intent, bounded_recent_intents, retrieved_manual, current_get_user_info]
    current_question_priority: authoritative
    historical_context: At most three resolved recent user turns may fill omitted intent slots; full conversation text is never forwarded.
    permission_gate: Candidate pages absent from current GetUserInfo permissions are removed before navigation.
    route_rule: Open only the highest-ranked permitted page first; another page consumes the existing page budget and requires an evidence gap that the first page cannot resolve.
    scan_reuse: Dashboard and Licensing reuse their complete existing scan evidence for this improve-page change; do not repeat a full scan unless a locally affected boundary cannot be established.
  discovery:
    observed_requests: [xhr, fetch]
    scope: Requests caused by loading the selected page or by the one permitted drill action in the current Reader invocation.
    candidate_fields:
      - operationKey
      - method
      - path
      - pathTemplate
      - trigger
      - triggers
      - status
      - policyState
      - candidateKind
      - bounded_swagger_metadata
    bounded_discovery_fields:
      - candidates_and_candidateCount
      - selectableBusinessTruncated_and_selectableSupportTruncated
      - deltaCandidates_and_deltaCandidateCount
      - deltaSelectableBusinessTruncated_and_deltaSelectableSupportTruncated
    operation_key: Exact normalized method plus Swagger path template; it identifies an operation inside admin.portal.read and never names a separately registered business Tool.
    normalization:
      - Match observed URLs to a Swagger path template before counting candidates.
      - Deduplicate by normalized method plus path template; query values, pagination values, retries, and repeated requests do not create new candidates.
      - Keep only a bounded in-memory digest of business-relevant query or JSON-body filters to detect a material post-action variant of the same operation; exclude pagination, cursor, sort, cache, and authentication fields, and never expose the digest or source values.
      - Retain only healthy operations that can directly support the resolved business object, scope, filters, time conditions, and answer shape as selectable candidates.
    background_filter:
      exclude_from_candidate_count:
        - identity_and_session_bootstrap
        - static_and_runtime_configuration
        - telemetry_client_logs_and_analytics
        - notifications_and_health_checks
        - dropdown_enum_dictionary_and_lookup_loading
        - duplicate_retry_or_prefetch_requests
        - failed_blocked_pending_or_cancelled_requests
        - export_download_upload_or_business_mutation_operations
      rule: A support request identified by lookup/dictionary/enum semantics or a terminal status/type/category/priority/options resource may remain as bounded causal context for a filter control, but it is not an answer operation and does not contribute to maxCandidatesBeforeDrill.
      bounded_priority: Healthy business operations selectable in the current network mode take storage priority over support and blocked observations, so lower-priority traffic cannot consume every discovery slot or hide the answer operation.
  swagger_semantics:
    authority: Static Swagger metadata for all documented operations aids description but never grants page, button, data-scope, or network execution permission.
    compact_catalog: platform-gateway/config/reader-operation-catalog.json
    generation: node scripts/build_reader_operation_catalog.mjs
    sparse_metadata_fallback: When summary, description, or operationId is absent, selection may use only the bounded combination of tag, normalized path, request schema, response schema, and observed page trigger.
    forbidden_inference: A suggestive tag, path, field name, or successful historical call cannot cause direct API execution or bypass the current gateway network mode.
  drill:
    threshold: Perform no threshold-driven drill while the relevant currently selectable candidate count is at most maxCandidatesBeforeDrill; perform one safe drill when it is greater, or return not_confirmed when no unique safe drill control exists.
    maximum_depth: maxDrillDepth
    allowed_actions: [switch_tab, show_filter, filter, expand_details]
    action_source: One unique named read-only control already documented by retrieved knowledge or confirmed by bounded semantic observation.
    selection: Prefer the control most directly matching the unresolved intent; the model must not invent a selector, route, method, request body, or control label.
    delta_only: The Gateway emits an explicit deltaCandidates set by comparing added, health-materially-changed, or business-filter-changed normalized operations to the pre-action candidate set; repeated polling, retries, pagination, and trigger history alone never make an old operation part of the delta.
    verification: Verify the resulting selected state or expanded surface before using the operation delta.
    refusal: Ambiguous, unknown, disabled, write-capable, export, download, or unverifiable controls are never used for discovery.
  operation_selection:
    decision_values: [select, not_confirmed]
    selected_value: operationKey
    ranking_evidence:
      - direct_trigger_by_the_requested_page_state_or_safe_drill
      - matching_business_object_scope_filters_time_conditions_and_answer_shape
      - compatible_request_and_response_schema
      - compatible_swagger_tag_path_summary_or_description
      - current_permission_and_active_gateway_network_mode_confirmed
    execution_guard:
      - The selected operationKey must exactly match one current healthy page-observed candidate whose policyState is allowed, or bypassed only while the whitelist is disabled.
      - admin.portal.read remains the only Portal Tool; no module or operation-specific business Tool is registered or selected.
      - Only page-generated requests are observed; the model never supplies credentials, headers, opaque identifiers, arbitrary URLs, methods, free-form request bodies, or an operationKey to the network executor.
      - The selected operation constrains evidence interpretation and audit only; it is never replayed or directly invoked by the model.
      - Every operation remains subject to current GetUserInfo, navigation permission, the active gateway network mode, read-only action policy, and response reduction.
    insufficient_evidence: Zero relevant safe candidates, no uniquely supportable selection, an unsafe required interaction, exhausted drill depth, or unresolved ambiguity returns not_confirmed without guessing.
  selected_response_evidence:
    authority: A successful JSON response already produced by an operation on the current GetUserInfo-permitted page is valid business evidence after that exact operation is selected.
    shape: Preserve the response's existing JSON structure; do not require operation-specific schemas, DOM row classes, card classes, or duplicate visible text.
    binding: Attach evidence only after selection and only to the exact observed operation and current page state; selection does not replay or reconstruct the request.
    reduction:
      - Limit response bytes, nesting, collection length, scalar length, and total retained values.
      - Remove credentials, authentication material, binary or encoded payloads, and full file or document contents.
      - Mark truncation explicitly so a bounded list is not presented as complete.
    answer_grounding: When selected response evidence is present, the answer model may interpret and summarize that JSON directly; DOM evidence remains optional UI context and is not required to repeat API values.
    result_normalization: Harmless extra result fields, omitted optional fields, scalar answer aliases, and status aliases are normalized by code; only an unusable result, missing selected response, unsafe operation, or real evidence gap returns not_confirmed.
  visibility_and_redaction:
    selector_model_allow: [operationKey, trigger, triggers, status, policyState, candidateKind, bounded_swagger_semantics]
    selector_model_forbid: [request_headers, credentials, cookies, tokens, raw_request_body, unselected_responses, sensitive_business_values, full_api_catalog]
    answer_model_allow_after_selection: [selected_operation_metadata, bounded_selected_json_response, response_truncation_state, portal_observation]
    main_agent_allow: result_contract_only
    main_agent_forbid: [api_candidates, operationKey, raw_urls, request_parameters, request_headers, request_bodies, raw_responses, sensitive_response_fields]
    audit: Retain only bounded selected response evidence plus the normalized operation decision, aggregate candidate policy-state counts, selected policy state, trigger, and redacted failure classification needed for diagnosis; never retain secrets or unrestricted responses.

business_answer_quality:
  knowledge_projection:
    max_chunks: 8
    max_chunk_characters: 4000
    max_total_bytes: 48000
    rules:
      - Preserve bounded semantic-node content beyond the old 1000-character prefix and explicitly mark truncated nodes.
      - Evidence validation must use the same retained node content as the planner, without a second shorter prefix.
      - Strip only a verified complete retrieval envelope before truncation, preserving structured source provenance separately; metadata, Markdown headings, and truncated field prefixes are not business facts.
      - General field meaning and control explanations may use grounded knowledge without forcing a live read.
      - Knowledge retrieval success does not prove semantic relevance or permit live counts from a manual.
      - Exact source sentences remain valid evidence across commas; do not require one clause to support a complete quoted sentence.
      - A failed knowledge-grounding repair must copy relevant source sentences without expanded examples; final formatting handles the answer language.
      - Every strong clause of a compound fact must be supported within one retained chunk; one matching clause cannot conceal another unsupported clause or a numeric or negative contradiction.
      - Preserve source filenames in bounded retrieval traces even when a later early-failure outcome omits the full knowledge context.
  read_health:
    rules:
      - Failed, blocked, pending, or uncertain data loading cannot prove an empty collection.
      - Apply the same no-data gate to query results, observation reduction, and deterministic fallback.
      - Preserve independently observed rows even when other requests are unhealthy.
      - Detect page failures from explicit error surfaces and standalone loading states, not substrings inside business records. Validate the selected section independently of unrelated loading regions.
  tool_continuation:
    rules:
      - Each admin.portal.read invocation starts a fresh browser context; rebuild necessary read-only UI state explicitly.
      - Follow-up reads must remain within the cumulative action, page, and turn-time budgets.
      - Reduce each new observation before answering; tool success alone does not prove correct object, scope, or detail identity.
      - An initial state-changing read with no direct facts must still reduce its returned observation; a pure observe action is not a prerequisite for evidence already present.
      - Preserve original header/value relationships in list facts and final answers; do not invent semantic column labels from positional strings.
      - Retain headingless table nodes by their explicit node ID and kind; a missing visible heading must not discard identified row evidence.
      - Native rowFields mappings are bounded to four rows, twelve fields per row, and 300 characters per value; ambiguous cell alignment is not inferred.
      - List facts using native cell maps must be JSON-object strings whose field/value pairs belong to one observed row; duplicate keys and cross-row or cross-column joins are rejected.
      - A structured list fact must uniquely match one bounded native row, not collapse multiple records into a shared status value.
      - A partial native row selection under an observed view receives at most one semantic review within the existing turn deadline; code never automatically fills omitted rows or infers field predicates from view names.
      - Explicit user predicates and limits remain authoritative; semantic review is model-based and does not itself establish business acceptance.
      - A bounded list observation cannot establish complete collection coverage.
      - A plain selected-view list may recover from native rowFields when the observed selected state and heading cover every requested condition. Extra dates, identities, ownership, or predicates must not be inferred.
      - Validate claimed selectedState against observed node or parent state; do not preserve a model-only state claim when actual state is unknown.
      - A unique visible active tab may supply the state of a unique visible table; multiple tabs or tables are ambiguous and must not be inferred.
      - Initial and follow-up reads normalize a redundant trailing pure observe only after validating the original policy and original cumulative action/page budget; all other mixed observation plans remain invalid. Normalization never creates budget headroom.
      - Tab clicks require exactly one visible semantic target; never silently select the first of several matches or broaden a missing section locator.
      - Tab name matching prefers an exact accessible name. Only when no visible exact target exists may a same-scope role=tab match a separate label child plus a pure numeric count badge; arbitrary prefixes remain forbidden.
      - A named tab scope may resolve through one exact visible heading and its nearest section or region only when no named accessible region exists. Missing or ambiguous scope must never fall back to global tab lookup.
      - Explicit aria-selected is authoritative. When it is absent, a tab may use a unique active or selected class/data-state signal within a stable tab group; absence or ambiguity still fails. Observation state uses the same signals.
      - A manual section name is not proof of an accessible region name, and a permission identifier is not proof of a verified navigation entry.
  unchanged_boundaries:
    - Current GetUserInfo permissions remain authoritative, regardless of a user's claimed role.
    - Business writes, uploads, downloads, and exports remain forbidden; read-only filter Apply or Cancel is not a business submission.

semantic_selection:
  general:
    - Resolve the requested answer shape and authoritative page region before reading business facts.
    - Similar labels alone do not establish equivalent evidence; verify the requested business object, ownership, filters, time scope, and answer shape.
    - When no page was requested, use any sufficient authorized source supported by knowledge and live evidence; a recorded navigation path is not mandatory.
    - When the relevant manual node is missing or ambiguous, observe only within permission and return not_confirmed instead of inventing a mapping.
  dashboard:
    attention_request:
      authoritative_section: Needs Your Attention
      primary_content: named attention tab and bounded visible task rows
      forbidden_substitutes:
        - My Tasks category counts
        - Overdue Tasks metric alone
        - Needs Manager Attention
      rule: Nonzero task categories do not prove that those tasks need attention.
    task_summary_request:
      authoritative_section: My Tasks
      primary_content: visible task category counts
      example_intents:
        - Give me an overview of my Dashboard tasks.
        - Show my licensing tasks overview.
      forbidden_substitutes:
        - My Application Tasks list rows
        - Needs Your Attention tabs or rows
      rule: A task summary does not become an attention answer without explicit attention evidence.
    overdue_request:
      authoritative_section: Overdue Tasks
      primary_content: explicit overdue metric or matching overdue rows when the page provides them
      rule: The metric alone supports a count, not an inferred task list.
    manager_attention_request:
      authoritative_section: Needs Manager Attention
      required_scope: [team, global]
      rule: Use only when the current role and page evidence establish manager scope; never substitute personal attention rows.
  licensing:
    list_request:
      primary_content: bounded matching list rows
      rule: Return record identities and relevant visible fields; an overview count alone does not answer a list or show request.
    count_request:
      primary_content: verified matching count
      rule: Do not enumerate records unless needed to explain the count or requested by the user.
    overview_request:
      primary_content: verified summary appropriate to the requested task family and ownership
      typical_sources: [Dashboard My Tasks, Applications task summary, Team Management task summary]
      forbidden_substitutes:
        - team tasks presented as personal tasks
        - application-only totals presented as all task categories
        - attention rows presented as a workload distribution
      rule: Resolve ambiguous Licensing tasks from the question and bounded context; clarify materially different scopes instead of hardcoding a Dashboard-only or Applications-only meaning.
    mixed_list_overview_request:
      primary_content: verified overview followed by bounded matching rows
      rule: Do not reduce an explicit tasks or records request to counts only.
    analytics_request:
      page: /licensing/reports-analytics
      sections: [Service Operations Analytics, Profile Analytics, License Analytics]
      requirements:
        - Verify active top-level and nested tabs and the displayed period before using aggregate or table evidence.
        - Ignore hidden tables mounted under inactive tabs.
        - Do not interpret analytics as personal assigned work or assume independently displayed totals have identical aggregation.
        - Search or pagination of a performance table does not establish that its surrounding charts changed.
    export_report_request:
      section: Reports
      rule: License Data, Cancelled Activities, and Electronic Media are export configuration surfaces, not visible report-result tables. Do not dispatch Export or infer exported contents; separately label any sufficient permitted analytics fallback.
    team_request:
      page: /licensing/team-management
      requirements:
        - Require current Team Management page permission, not a manager title alone.
        - Distinguish Team Tasks, personal Applications, and Team Members performance.
        - Verify Application Task Only and the category before claiming a cross-category team result.
        - Reassign, Mark Emergency Leave, Resume Work, selection for bulk reassignment, and Export remain forbidden.

readonly_interaction_contract:
  common:
    - Interact only with named controls described by retrieved knowledge or confirmed by bounded semantic observation.
    - Verify the resulting active tab, filter value, selected record identity, or detail identity before using facts.
    - Unknown, ambiguous, disabled, write-capable, export, or download controls are blocked before dispatch.
  list_surface:
    allowed:
      - switch a named list tab
      - paginate within the bounded result request
      - sort by a named supported column
    requirements:
      - Verify the active tab, current page, and sort state after an interaction.
      - Preserve and reverify active filters across sorting and pagination.
      - Do not claim a complete list unless the bounded traversal actually covers every page.
  filter_dialog_or_drawer:
    allowed:
      - open a named filter surface
      - read supported controls and active values
      - set supported text, single-select, multi-select, or date-range values
      - apply, reset, or cancel the filter
      - close the surface
      - verify active filters and matching results
    requirements:
      - Apply is successful only when the active values and resulting list state are observable.
      - Cancel must not be reported as applied; Reset must be verified before describing an unfiltered result.
      - Unsupported controls, ambiguous date semantics, or unverifiable compound filters produce not_confirmed.
  readonly_detail_dialog_or_drawer:
    allowed:
      - open details from a permitted visible list record
      - switch named read-only detail tabs
      - expand named read-only sections
      - close the detail surface and return to the list
    requirements:
      - The selected list identifier and detail identifier must match before detail facts are returned.
      - Opening a detail must preserve current-session permission and the originating list context.
      - Direct guessed detail URLs and document contents are forbidden.
      - A native visible record-ID cell may use a distinct, query-free, currently permitted detail route without a read-button code; the click, not the planner, supplies opaque query identifiers.
      - The record-ID cell must be unique and match the requested identity; verify the resulting route and rendered business identifier before returning detail facts.
      - A mutation-button code must never substitute for a read permission; non-cell details and expansions retain their button-permission requirements.
  action_dialog:
    rule: Approval, rejection, submission, modification, deletion, assignment, sending, upload, download, export, and unknown action dialogs are outside the Reader and must be refused without opening or confirming them.

general_knowledge:
  purpose: Answer non-Portal general knowledge or document questions.
  allowed_tools:
    - knowledge.search

tools:
  knowledge.search:
    side_effect: read
    use: Retrieve the relevant Admin user manual and role-difference guidance.
  admin.portal.read:
    side_effect: read
    auth: current_umc_session
    user_info_source: /api/AdminUser/GetUserInfo
    operation_discovery: The Tool returns bounded page-generated candidates governed by page_api_discovery_contract; operationKey selection remains internal to the Reader and is never accepted as a network-call parameter.
    allowed_actions:
      - navigate
      - query
      - filter
      - paginate
      - switch_tab
      - expand_details
      - show_filter
      - apply_filter
      - reset_filter
      - sort
      - show_detail
      - dismiss_overlay
    forbidden_actions:
      - approve
      - submit
      - modify
      - delete
      - assign
      - send
      - upload
      - download
      - export
    network_policy:
      config_file: platform-gateway/config/reader-network-policy.json
      enable_env: PORTAL_READER_WHITELIST_ENABLED
      config_path_env: PORTAL_READER_WHITELIST_FILE
      runtime_default_enabled: true
      local_business_validation_enabled: false
      config_loading: startup_only_invalid_or_missing_file_fails_startup
      disabled_mode:
        same_origin_http_method_and_path_checks: bypassed_including_explicit_path_blocks
        account_and_navigation_permissions: enforced
        cross_origin_and_stream_requests: blocked
        explicit_reader_business_mutations: forbidden
        browser_downloads: cancelled
        network_level_read_only_guarantee: unavailable
        health_mode: same-origin-unrestricted
        operation_selection: Healthy page-observed allowed and bypassed operations are selectable; blocked or failed operations are not.
      conditionally_allowed_methods: [GET, POST, OPTIONS]
      condition: When enabled, use the method/path rules from config_file; API requests are default-deny and static reads remain same-origin only.
      blocked_methods_when_enabled: [PUT, PATCH, DELETE]

result_contract:
  result:
    enum: [success, no_data, no_permission, load_failed, not_confirmed]
  fields:
    page: string
    section: string
    sourceSection: string
    answerShape:
      enum: [overview, count, list, attention, due, detail, unspecified]
    completeness:
      enum: [bounded, complete, unknown]
    selectedState: string
    scope:
      enum: [personal, team, global, unknown]
    facts: string_array
    workflowState: string
    missing: string_array
  model_visibility:
    allow: [result, page, section, sourceSection, answerShape, completeness, selectedState, scope, facts, workflowState, missing]
    forbid: [html, fullPage, fullTable, credentials, cookies, tokens, internalErrors, rawAuditEvidence, apiCandidates, operationKey, rawRequests, rawResponses, sensitiveResponseFields]

answer_contract:
  principles:
    - Lead with the business conclusion in the user's language; the page and Tool are evidence, not the subject of the answer.
    - Do not narrate visibility, page reads, bounded snapshots, extraction, Tool execution, or audit evidence in an ordinary successful answer.
    - Express a confirmed scope naturally, for example currently, in your Dashboard, or for your account.
    - Add one concise limitation only when partial evidence or an unconfirmed scope materially changes how the answer should be interpreted.
    - Validate facts independently for both success and not_confirmed; retain grounded fields when other fields are unavailable. A rejected source, page, or selected-state claim must never bypass grounding through a failure fallback.
    - A failed completion review retains the candidate facts only after validating them against the current permitted observation; previous-turn facts are not reused.
    - Rejected observation facts receive at most one grounding review per turn within the existing deadline. Corrected facts must pass the same source, state, field-binding, and numeric checks; a failed repair preserves only already validated partial facts.
    - Answer-shape mismatches must not erase verified evidence. Narrow content equivalence may satisfy the shape; otherwise preserve the facts as partial without claiming the requested list, ranking, date range, or details were established.
    - Attention-region counts may be retained as partial evidence when item details are unavailable; ordinary workload counts cannot establish priority.
    - Invalid observation references remain an evidence-validation failure, not an invalid follow-up action plan.
    - Bind an observation result using its section, sourceSection, and observed selectedState together. A control or active-view label cannot globally match a similarly named region; explicit parentRef descendants may supply child evidence within the declared region.
    - Canonicalize a verified source to its current-observation nodeId. An exact observed selectedState may disambiguate repeated headings, but different evidence under identical heading and state remains ambiguous. Do not carry node IDs across fresh reads as current evidence.
    - An observed active control may match its exact label without a trailing numeric count badge. Require that control in the same evidence node; do not accept arbitrary prefixes, conflicting explicit counts, or missing controls.
    - Grounding repair receives the bounded program-resolved source when available and records its acceptance or rejection in the quality trace. Initial, post-action, replay, and recovery fallbacks must preserve the same source, page, and selected-state constraints.
    - After source binding succeeds, the grounding-repair planner receives only that source node and the original read health as its page observation. Validate its answer against the original observation; do not reintroduce unrelated regions or replace a bound source during repair.
    - A required pre-observation read is an evidence-acquisition phase. Missing current records or indicators is not itself a reason to stop; establish a documented permitted entry and observe it, or report the actual entry or permission gap without guessing routes.
    - Never turn a nonzero category count into a recommendation or an attention claim without authoritative attention evidence.
  internal_process_phrases_forbidden_in_success:
    - Based on the visible
    - visible to you
    - this read
    - bounded snapshot
    - page extraction
  partial_list_rule: State that records are examples or currently shown only when completeness cannot be established; do not expose implementation limits.
  not_confirmed_rule: State what could not be confirmed and, when useful, provide a clearly labeled confirmed fallback without presenting it as the requested result.
  evidence_gap_guard: Non-success results use only confirmed facts and a status message; never turn missing, summary, historical prose, or common knowledge into a new business assertion. A successful result without facts is not permission to invent an answer.

audit:
  retain:
    - normalized_page_address
    - login_account
    - current_role
    - permission_fingerprint
    - role_and_department
    - applied_filters
    - observation_time
    - bounded_raw_extraction
    - bounded_operation_discovery_decision
    - error_classification
    - action_trace
  redact:
    - password
    - authorization
    - access_token
    - refresh_token
    - cookie
    - session
  user_response: Natural-language business conclusion only; do not expose internal Tool names, page parameters, visibility narration, read or snapshot mechanics, or audit evidence.
  quality_trace:
    purpose: Attribute an incorrect or unconfirmed answer to one Reader stage without retaining raw pages, chunks, facts, or user text.
    stages:
      - question_context
      - identity_permissions
      - knowledge_retrieval
      - planning
      - operation_discovery
      - operation_selection
      - read_policy
      - portal_execution
      - result_classification
      - answer_assembly
    entry_fields: [stage, status, durationMs, input, output, failureCode]
    statuses: [passed, failed, degraded, skipped]
    root_cause: The latest failed stage code for an unsuccessful Reader result; empty for success or no_data.
    forbidden: [question_text, full_page, full_table, chunk_content, facts, credentials, cookies, tokens]

session_isolation:
  multi_account_login_concurrency: 1
  requirements:
    - Revalidate GetUserInfo after every login or account switch.
    - Reject a read when the observed identity does not match the expected session.
    - Do not reuse permission context across identities.
