  - id: reader-licensing-five-outcomes
    coverage: [Applications, Profile Verification, Licenses, Reports & Analytics, Team Management]
    fixtures:
      success: bounded_matching_visible_evidence
      no_data: explicit_empty_under_verified_filters
      no_permission: missing_current_page_permission
      load_failed: required_page_or_read_transport_failed
      not_confirmed: ambiguous_period_scope_or_unverified_control
    expect:
      missing_or_loading_interpreted_as_zero: false
      full_module_scan_interpreted_as_deployed_acceptance: false

acceptance:
  - An initial tab switch that returns rows through a post-action observation is reduced without an unnecessary extra page read.
  - A list answer preserves verified field names and relationships instead of guessing headings or widening ownership semantics.
  - A non-success result without verified facts cannot produce business rules, inferred transitions, or empty-list claims from missing or history text.
  - A non-success result with independently confirmed facts preserves those facts and marks the remaining limitation.
  - Grounding accepts exact multi-clause source quotations while retaining polarity and cross-chunk relationship checks; a repair must not expand the source with assumptions.
  - Every text question in the Admin runtime selects admin_portal_reader; the Reader may terminate as knowledge_only when no live page read is needed.
  - No module-level Skill or legacy business Tool is selected.
  - Dashboard and Licensing page discovery reuses the existing complete scans; this improve-page change does not require a new full scan unless an affected local boundary is unresolved.
  - Every page read starts with current-session GetUserInfo.
  - Relevant healthy operations are deduplicated by method and Swagger path template, and background, lookup, failed, mutation, export, and download requests do not inflate the candidate threshold.
  - Candidate count is a bounded capture and model-context signal, not a business-flow gate; an intact candidate set may proceed to semantic selection at any count, and only truncation or unresolved ambiguity without answerable evidence may trigger at most one verified safe read-only drill.
  - After operation selection, its already received bounded JSON response is valid business evidence regardless of operation-specific shape and does not require duplicate DOM rows or cards.
  - API response evidence and DOM observation evidence are independent channels; either may establish answerable facts without duplicate proof, while incompatible channels remain unresolved rather than being merged.
  - Only the selected response is exposed to the answer model; credentials, unrestricted payloads, binary content, and unselected responses remain excluded.
  - Swagger metadata supports semantic selection but never grants permission; missing prose falls back to bounded tag, path, schema, and observed-trigger evidence.
  - The main Agent receives only the bounded result contract, never the discovered API catalog, selected operationKey, raw requests or responses, or sensitive response fields.
  - All browser and network mutations are blocked before dispatch.
  - Result states distinguish no data, no permission, load failure, and insufficient evidence.
  - Model-visible evidence is bounded and contains no complete page or table.
  - Audit evidence is sufficient for diagnosis and contains no credentials or session secrets.
  - Reader audit evidence identifies the GetUserInfo login account and current role without changing the permission fingerprint.
  - Dashboard attention, task summary, overdue, and manager-attention intents select their authoritative regions without substituting semantically related counts or lists.
  - Licensing list, count, overview, and mixed list-overview questions return the requested answer shape.
  - Named filter dialogs or drawers and read-only detail surfaces remain bounded, identity-verified, and mutation-free; action dialogs and unknown controls are refused before dispatch.
  - Successful user answers lead with the business conclusion and do not narrate page visibility, reads, snapshots, extraction, Tool execution, or audit evidence.
  - ANSWERABLE always reaches a mechanically validated assistant.message; free-form formatter failure or unsupported output falls back to deterministic rendering of the frozen AnswerBundle.
  - Every material claim in assistant.message is supported by the AnswerBundle, with an unsupported-claim rate of zero.
  - Audit failure classification distinguishes evidence absence, mismatch, ambiguity, and incompleteness from planner, selector, schema, grounding, completion-review, formatter, and delivery failures.
