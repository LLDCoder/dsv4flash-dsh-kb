module: service-configuration
portal: admin
mode: assistant-readonly
sources:
  portal_pages: [/service-management/service-configuration, /service-management/service-categories, /service-management/reports-analytics]
  knowledge_folder: /umc
roles:
  - actor: service-configuration-staff
    portal_role: System Administrator
    verified_access: [service-configuration, service-categories]
skills:
  - id: admin_service_configuration_reader
    use_when: authorized service list, status/type/category filters, selected service detail, and configuration summary
    not_when: workflow versions/readiness-only, policy-only, or requested configuration changes
  - id: admin_service_workflow_reader
    use_when: selected service workflow, version, engine status, readiness, fee/rule/penalty readiness questions
    not_when: service list, policy-only, or requested publish/configure changes
  - id: admin_service_configuration_guidance
    use_when: cited service configuration or service-process guidance
    not_when: live service records without a knowledge component
  - id: admin_service_configuration_read_only_boundary
    use_when: create, configure, edit, publish, suspend, delete, export, download, upload, or priority-management requests
    not_when: authorized read-only queries
