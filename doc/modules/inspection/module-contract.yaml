module: inspection
portal: admin
mode: assistant-readonly
knowledge:
  folder_id: 34a89aa7b43b473d8326cf6540fc3894
  folder_path: /umc
  citations_required: true
  source_rule: Use only sources directly relevant to inspection operations, violations, compliance, appeals, or inspection reporting.
intents:
  - id: admin_inspection_dashboard_reader
    name: Inspection dashboard reader
    domain: inspection
    allowed_tools:
      - admin.inspectiondashboard.get-inspection-dashboard-overview
      - admin.inspectiondashboard.get-inspection-dashboard-tasklist
    when_use: Read the authenticated Inspection user's dashboard summary, counts, workload, SLA, team context, or declared attention list for a requested period. An unqualified attention or focus question must read the Needs Your Attention overview summary first.
    when_not_use: A single task or violation detail, policy-only guidance, a cross-department aggregate, or any requested mutation, assignment, approval, export, or download.
    filters:
      date_range: date_range
      limit: integer
      attention_task_type: string
    attention_workflow:
      overview:
        when: The user asks generally what needs attention or what they should focus on.
        tool: admin.inspectiondashboard.get-inspection-dashboard-overview
        response_fields: [needsAttentionSummary.inspectionTasksCount, needsAttentionSummary.otherTasksCount, needsAttentionSummary.totalCount]
        rule: Do not call a task list or knowledge search for this unqualified request.
      inspection_list:
        when: The user explicitly asks for the Inspection Tasks attention category.
        tool: admin.inspectiondashboard.get-inspection-dashboard-tasklist
        parameters: { listType: needsAttentionInspection }
      other_list:
        when: The user explicitly asks for the Other Tasks attention category.
        tool: admin.inspectiondashboard.get-inspection-dashboard-tasklist
        parameters: { listType: needsAttentionOther }

  - id: admin_inspection_task_reader
    name: Inspection task reader
    domain: admin_inspection
    allowed_tools:
      - admin.inspectiontask.get-admin-inspection-tasks
      - admin.inspectiontask.get-admin-inspection-tasks-id
      - admin.inspectiontask.get-admin-inspection-tasks-stats
      - knowledge.search
    when_use: List, search, filter, count, compare, or inspect authorized inspection tasks, including an item selected from a prior list.
    when_not_use: Violation records, management analytics, policy-only questions, or any requested mutation.
    filters:
      keyword: string
      statuses: string_array
      priorities:
        type: enum
        source: /api/admin/inspection/lookup/priorities?scope=InspectionPriority
        values: { Critical: 1, High: 2, Medium: 3, Low: 4 }
        follow_up: A declared priority correction in the same period preserves the prior date range and invokes the existing task-list reader.
      date_range: date_range
      due_date_range: date_range
      emirate: string
      scope: string
      limit: integer
    selection:
      source_tool: admin.inspectiontask.get-admin-inspection-tasks
      items_path: data.items
      identifier_fields: [id, taskId, taskNo]
      value_field: id
      supports_ordinals: true
    hybrid_guidance:
      when_use: A user selects an Inspection task and asks for reporting guidance about that selected task.
      primary_tool: admin.inspectiontask.get-admin-inspection-tasks-id
      knowledge_tool: knowledge.search
      knowledge_scope: [34a89aa7b43b473d8326cf6540fc3894]
      response_rules:
        - Combine the live task detail with authoritative Inspection guidance; do not substitute one for the other.
        - Do not run the hybrid flow without an explicit task selection or stable task identifier.

  - id: admin_inspection_violation_reader
    name: Inspection violation reader
    domain: admin_inspection
    allowed_tools:
      - admin.inspectionviolation.get-admin-inspection-violations
      - admin.inspectionviolation.get-admin-inspection-violations-id
      - admin.inspectionviolation.get-admin-inspection-violations-stats
    when_use: List, filter, count, compare, or inspect authorized inspection violations and their read-only history.
    when_not_use: Task-only questions, policy-only questions, payment or appeal actions, or any mutation.
    filters:
      keyword: string
      statuses: string_array
      violation_type: string
      date_range: date_range
      scope: string
      limit: integer
    selection:
      source_tool: admin.inspectionviolation.get-admin-inspection-violations
      items_path: data.items
      identifier_fields: [id, violationId, violationNo]
      value_field: id
      supports_ordinals: true

  - id: admin_inspection_analytics_reader
    name: Inspection analytics reader
    domain: admin_inspection
    allowed_tools:
      - admin.inspectionreportsanalytics.get-inspection-reportsanalytics-operationalinsights
      - admin.inspectionreportsanalytics.get-inspection-reportsanalytics-riskinsights
      - admin.inspectionreportsanalytics.get-inspection-reportsanalytics-teamperformance
    when_use: Read inspection workload summaries, counts, urgency, SLA, risk, operational trends, or team performance for an authorized reporting period.
    when_not_use: One task or violation detail, process-only questions, or any requested assignment, approval, export, or mutation.
    filters:
      date_range: date_range
      keyword: string
      limit: integer
      sort_field: string
      sort_order: string

  - id: admin_inspection_guidance
    name: Inspection guidance and compliance
    domain: admin_inspection
    allowed_tools: [knowledge.search]
    when_use: Answer inspection process, compliance, violation, reporting, appeal, or regulatory questions from authoritative knowledge.
    when_not_use: The question needs a live task or violation, requests a business action, or lacks a relevant authoritative source.
    knowledge_scope: [34a89aa7b43b473d8326cf6540fc3894]
    response_rules:
      - Cite each substantive policy, process, or regulatory statement.
      - Include source title and version or effective date when supplied.
      - State when no relevant authoritative source is retrieved.

  - id: admin_inspection_read_only_boundary
    name: Inspection read-only boundary
    domain: admin_inspection
    allowed_tools: []
    when_use: The user asks to create, generate, assign, reassign, start, continue, cancel, duplicate, submit, approve, modify, transfer, decide, pay, export, download, upload, delete, or otherwise change Inspection business data.
    when_not_use: The user asks only to read authorized tasks, violations, analytics, or knowledge.
    routing_locked: true
    response_rules:
      - Refuse the requested business mutation.
      - Explain that the assistant can provide read-only information and relevant guidance.
      - Never invoke a write, export, download, upload, or deletion Tool.
