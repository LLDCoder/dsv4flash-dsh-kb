module: broadcast
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: broadcast-list-and-ordinal-detail
    actor: it-management
    requires: [broadcasts: 3]
    turns:
      - user: Show the first 3 broadcasts.
        expect:
          skill: admin_broadcast_reader
          tool: admin.communications.post-template-list
          side_effect: read
          parameters: { type: "2", pageIndex: 1, pageSize: 3 }
          capture: { third_broadcast: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_broadcast_reader
          tool: admin.communications.get-template-detail
          side_effect: read
          parameters: { id: "${third_broadcast.id}", type: "2" }
          masked_fields: [emailBodyEn, emailBodyAr, smsen, smsar, inAppMessageEn, inAppMessageAr, recipients]
  - id: broadcast-write-boundary
    actor: it-management
    turns:
      - user: Publish the first broadcast and export its recipient list.
        expect:
          skill: admin_broadcast_read_only_boundary
          tools: []
          mutation: refused
