module: customer-happiness
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: happiness-enquiry-status-and-ordinal-detail
    actor: happiness-leader
    requires: [enquiries: 3]
    turns:
      - user: List my open Customer Happiness enquiries and complaints ordered by SLA.
        expect:
          skill: admin_customer_happiness_enquiry_reader
          tool: admin.enquiry.get-enquiry-management-list
          side_effect: read
          capture: { third_enquiry: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_customer_happiness_enquiry_reader
          tool: admin.enquiry.get-enquiry-management-enquiryid-enquiryinfo
          parameters: { enquiryId: "${third_enquiry.id}" }

  - id: happiness-enquiry-filter-correction
    actor: happiness-leader
    requires: [enquiries: 1]
    turns:
      - user: Show Customer Happiness enquiries from the last 7 days.
        expect: { skill: admin_customer_happiness_enquiry_reader, tool: admin.enquiry.get-enquiry-management-list }
      - user: Only show reopened ones in the same period.
        expect:
          skill: admin_customer_happiness_enquiry_reader
          normalized_filters: { date_range: inherited, reopened: true }

  - id: happiness-enquiry-count
    actor: happiness-leader
    turns:
      - user: How many Customer Happiness enquiries are open, pending customer, and department processing?
        expect:
          skill: admin_customer_happiness_enquiry_reader
          tool: admin.enquiry.get-enquiry-management-status-count
          side_effect: read

  - id: happiness-refund-list-and-detail
    actor: happiness-leader
    requires: [refunds: 2]
    turns:
      - user: List my Customer Happiness refund tasks ordered by SLA.
        expect:
          skill: admin_customer_happiness_refund_reader
          tool: admin.refund.get-refund-admin-tickets-customerservice
          capture: { first_refund: "result_set.items[0]" }
      - user: Show the first refund details and timeline.
        expect:
          skill: admin_customer_happiness_refund_reader
          tools:
            - admin.refund.get-refund-admin-tickets-refundid-detail
            - admin.refund.get-refund-admin-tickets-refundid-timeline
          parameters: { refundId: "${first_refund.refundId}" }

  - id: happiness-appeal-list-and-detail
    actor: happiness-leader
    requires: [appeals: 2]
    turns:
      - user: List current Customer Happiness appeals ordered by SLA.
        expect:
          skill: admin_customer_happiness_appeal_reader
          tool: admin.inspectionappeal.get-admin-inspection-appeals-customer-happiness-todo
          capture: { first_appeal: "result_set.items[0]" }
      - user: Show the first appeal's violation items and timeline.
        expect:
          skill: admin_customer_happiness_appeal_reader
          tools:
            - admin.inspectionappeal.get-admin-inspection-appeals-appealid-violation-items
            - admin.inspectionappeal.get-admin-inspection-appeals-appealid-timeline
          parameters: { appealId: "${first_appeal.id}" }

  - id: happiness-operational-analytics
    actor: happiness-leader
    requires: [reports_analytics_access: true]
    turns:
      - user: Show Customer Happiness operational insights for the last 30 days.
        expect:
          skill: admin_customer_happiness_analytics_reader
          tool: admin.customerhappinessanalytics.post-customer-happiness-analytics-operational-insights-summary
          parameters: { startDate: runtime_last_30_days_start, endDate: runtime_today }
      - user: Show team performance in the same period.
        expect:
          skill: admin_customer_happiness_analytics_reader
          tool: admin.customerhappinessanalytics.post-customer-happiness-analytics-operational-insights-team-performance
          parameters: { startDate: inherited, endDate: inherited }
          normalized_filters: { date_range: inherited }

  - id: happiness-team-summary
    actor: happiness-leader
    turns:
      - user: Show the Customer Happiness team summary.
        expect:
          skill: admin_customer_happiness_team_reader
          tool: admin.customerhappinessteammanagement.get-customer-happiness-team-management-summary-v2
          side_effect: read
      - user: Now list available Customer Happiness team members.
        expect:
          skill: admin_customer_happiness_team_reader
          tool: admin.customerhappinessteammanagement.get-customer-happiness-team-management-members-optimized
          side_effect: read

  - id: happiness-knowledge-guidance
    actor: happiness-leader
    requires: [knowledge_source: customer_happiness_or_service]
    turns:
      - user: What is the Customer Happiness process for handling a complaint?
        expect:
          skill: admin_customer_happiness_guidance
          tool: knowledge.search
          citations: required

  - id: happiness-hybrid-case-guidance
    actor: happiness-leader
    requires: [enquiries: 1, knowledge_source: customer_happiness_or_service]
    turns:
      - user: List my Customer Happiness enquiries.
        expect:
          skill: admin_customer_happiness_enquiry_reader
          tool: admin.enquiry.get-enquiry-management-list
          capture: { selected_enquiry: "result_set.items[0]" }
      - user: What process guidance applies to this case?
        expect:
          skills: [admin_customer_happiness_enquiry_reader, admin_customer_happiness_guidance]
          tools: [admin.enquiry.get-enquiry-management-enquiryid-enquiryinfo, knowledge.search]
          citations: required

  - id: happiness-write-boundary
    actor: happiness-leader
    turns:
      - user: Change the first enquiry status and send the customer a message.
        expect:
          skill: admin_customer_happiness_read_only_boundary
          tools: []
          mutation: refused

  - id: happiness-router-fallback-live-data
    actor: happiness-staff
    turns:
      - user: Show my Customer Happiness enquiries.
        expect:
          skill: admin_customer_happiness_enquiry_reader
          tool: admin.enquiry.get-enquiry-management-list
          fallback_to_knowledge_only: forbidden

  - id: happiness-new-conversation-reference-boundary
    actor: happiness-leader
    turns:
      - user: What about the third one?
        expect:
          clarification: required
          tools: []
