module: finance
portal: admin
mode: assistant-readonly
sources:
  portal_pages: [/financial-payment/transactions, /financial-payment/refunds, /financial-payment/reports-analytics]
  knowledge_folder: /umc
roles:
  - actor: finance-admin
    portal_role: Finance Officer
    verified_access: [transactions, refunds, reports-analytics]
skills:
  - id: admin_finance_transaction_reader
    use_when: authorized transaction lists, date and keyword filters, current totals, and selected transaction detail
    not_when: refund, policy-only, or requested financial change/export
  - id: admin_finance_refund_reader
    use_when: authorized finance refund lists, totals, filters, and selected refund detail
    not_when: transaction, policy-only, or requested refund change/export
  - id: admin_finance_analytics_reader
    use_when: finance revenue, payment-method, and recharge aggregates for the current authorized scope
    not_when: a date-bounded aggregate, live record detail, policy-only question, or requested data change
    limitation: The registered aggregate Tools expose no date parameters. For a date-bounded Finance request, use an authorized transaction or refund list and state that aggregate breakdowns are unavailable for that window.
    profile_scope: token-scoped aggregate Tools return the authenticated Finance role's authorized view, including the Portal's Global View; only Tools declared bind-parameter require a concrete Portal profile.
  - id: admin_finance_date_aggregate_limitation
    use_when: a date-bounded Finance revenue, payment-method, or recharge aggregate is requested.
    not_when: an aggregate is requested for the current authorized scope, or a date-bounded transaction/refund list is requested.
    tools: []
    response_policy: Explain that the registered aggregate endpoints do not support a reporting window. Do not call an unfiltered aggregate and present it as the requested period.
  - id: admin_finance_guidance
    use_when: cited finance/payment process or policy guidance
    not_when: live financial records without a knowledge component
  - id: admin_finance_read_only_boundary
    use_when: requested payment/refund actions, exports, downloads, uploads, or deletes
    not_when: authorized read-only queries
deferred: [dashboard-overview]
