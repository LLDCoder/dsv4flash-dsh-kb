module: finance
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: finance-transaction-list-detail
    actor: finance-admin
    turns:
      - user: List Finance transactions from the last 7 days ordered by date.
        expect: { skill: admin_finance_transaction_reader, tool: admin.finance.get-admin-finance-transactions, side_effect: read, parameters: { StartDate: runtime_last_7_days_start, EndDate: runtime_today, PageIndex: 1 }, capture: { third_transaction: "result_set.items[2]" } }
      - user: What about the third one?
        expect: { skill: admin_finance_transaction_reader, tool: admin.finance.get-admin-finance-transactions-transactionno, parameters: { transactionNo: "${third_transaction.transactionNo}" } }
  - id: finance-payment-summary
    actor: finance-admin
    turns:
      - user: Show the current Finance payment-method breakdown.
        expect: { skill: admin_finance_analytics_reader, tool: admin.finance.get-admin-finance-transactions-payment-method-statistics, side_effect: read, profile_scope: token_scoped, portal_global_view: permitted }
  - id: finance-refund-list-detail
    actor: finance-admin
    turns:
      - user: List Finance refunds and their current status.
        expect: { skill: admin_finance_refund_reader, tool: admin.adminpaymentsrefunds.get-admin-payments-refunds, capture: { first_refund: "result_set.items[0]" } }
      - user: Show the first refund details.
        expect: { skill: admin_finance_refund_reader, tool: admin.adminpaymentsrefunds.get-admin-payments-refunds-refundno }
  - id: finance-analytics-current-scope
    actor: finance-admin
    turns:
      - user: Show current Finance revenue analytics.
        expect: { skill: admin_finance_analytics_reader, tool: admin.finance.get-admin-finance-transactions-statistics, side_effect: read }
      - user: Show the payment-method breakdown.
        expect: { skill: admin_finance_analytics_reader, tool: admin.finance.get-admin-finance-transactions-payment-method-statistics, side_effect: read }

  - id: finance-date-bounded-aggregate-limitation
    actor: finance-admin
    turns:
      - user: Show the payment-method breakdown for the last 30 days.
        expect:
          limitation: aggregate_date_filter_not_supported_by_registered_tool
          tools: []
  - id: finance-guidance
    actor: finance-admin
    turns:
      - user: What is the payment refund process?
        expect: { skill: admin_finance_guidance, tool: knowledge.search, citations: required }
  - id: finance-write-boundary
    actor: finance-admin
    turns:
      - user: Approve and export the first Finance refund.
        expect: { skill: admin_finance_read_only_boundary, tools: [], mutation: refused }
