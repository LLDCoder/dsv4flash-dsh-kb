module: content
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: content-task-status-and-ordinal-detail
    actor: content-officer
    requires: [todo_tasks: 3]
    turns:
      - user: Show my Content tasks with an Initial Approval status.
        expect:
          skill: admin_content_task_reader
          tool: admin.content.post-content-mytodopage
          side_effect: read
          capture: { third_task: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_content_task_reader
          tool: admin.content.get-content-myreviewdetail-taskid
          parameters: { taskId: "${third_task.taskId}" }

  - id: content-task-filter-correction
    actor: content-officer
    requires: [todo_tasks: 1]
    turns:
      - user: List my Content tasks from the last 7 days.
        expect: { skill: admin_content_task_reader, tool: admin.content.post-content-mytodopage }
      - user: Not those. Only show Pending Modification tasks in the same period.
        expect:
          skill: admin_content_task_reader
          normalized_filters: { date_range: inherited, statuses: [Pending Modification] }

  - id: content-dashboard-urgent-drilldown
    actor: content-manager
    requires: [dashboard_access: true]
    turns:
      - user: How many Content tasks need attention today?
        expect: { skill: admin_content_dashboard_reader, tool: admin.contentdashboard.get-content-dashboard-overview }
      - user: Which ones are most urgent?
        expect:
          skill: admin_content_dashboard_reader
          tool: admin.contentdashboard.get-content-dashboard-tasklist
          normalized_filters: { list_type: inherited }

  - id: content-dashboard-trend
    actor: content-manager
    requires: [dashboard_access: true]
    turns:
      - user: Show Content SLA performance and overdue tasks for the last 30 days.
        expect: { skill: admin_content_dashboard_reader, tool: admin.contentdashboard.get-content-dashboard-overview }

  - id: content-library-book-detail
    actor: content-officer
    requires: [books: 3]
    turns:
      - user: List pending books in the Content Library.
        expect:
          skill: admin_content_library_reader
          tool: admin.contentlibrary.get-contentlibrary-getbooklist
          capture: { first_book: "result_set.items[0]" }
      - user: Show details for the first book.
        expect:
          skill: admin_content_library_reader
          tool: admin.contentlibrary.get-contentlibrary-getbookdetailsbyid
          parameters: { bookid: "${first_book.id}" }

  - id: content-library-cinema-list-and-ordinal-detail
    actor: content-officer
    requires: [cinema_items: 3]
    turns:
      - user: List the first 5 movies in the Content Library.
        expect:
          skill: admin_content_library_reader
          tool: admin.contentlibrary.get-contentlibrary-getcinemalist
          side_effect: read
          capture: { third_cinema: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_content_library_reader
          tool: admin.contentlibrary.get-contentlibrary-getcinemadetailsbyid
          parameters: { cinemaid: "${third_cinema.id}" }

  - id: content-library-newspaper-and-video-game-list-detail
    actor: content-officer
    requires: [newspapers: 1, video_games: 1]
    turns:
      - user: List the first 5 newspapers or magazines in the Content Library.
        expect: { skill: admin_content_library_reader, tool: admin.contentlibrary.get-contentlibrary-getnewspaperlist }
      - user: Show details for the first one.
        expect: { skill: admin_content_library_reader, tool: admin.contentlibrary.get-contentlibrary-getnewspaperdetailsbyid }
      - user: List the first 5 video games in the Content Library.
        expect: { skill: admin_content_library_reader, tool: admin.contentlibrary.get-contentlibrary-getvideogameslist }
      - user: What about the first one?
        expect: { skill: admin_content_library_reader, tool: admin.contentlibrary.get-contentlibrary-getvideogamesdetailsbyid }

  - id: content-team-summary-and-members
    actor: content-manager
    requires: [content_team_management_access: true]
    turns:
      - user: Show the Content team summary.
        expect:
          skill: admin_content_team_reader
          tool: admin.contentteammanagement.get-content-team-management-summary-v2
          side_effect: read
      - user: Which Content team members are available in the last 7 days?
        expect:
          skill: admin_content_team_reader
          tool: admin.contentteammanagement.get-content-team-management-members-optimized
          normalized_filters: { date_range: explicit }

  - id: content-team-task-list-and-write-boundary
    actor: content-manager
    turns:
      - user: List Content team tasks waiting for review.
        expect:
          skill: admin_content_team_reader
          tool: admin.contentteammanagement.post-content-team-management-tasks-query
          side_effect: read
          parameters: { view: todo }
      - user: What about the third task?
        expect:
          clarification_or_gap: registered_detail_tool_required
          tools: []
      - user: Reassign the first Content team task and export the list.
        expect:
          skill: admin_content_read_only_boundary
          tools: []
          mutation: refused

  - id: content-permit-analytics-and-list
    actor: content-manager
    requires: [content_permit_access: true]
    turns:
      - user: Show the Content permit overview for the last 7 days.
        expect:
          skill: admin_content_permit_reader
          tool: admin.licensemanagement.get-licensemanagement-content-permit-analytics
          side_effect: read
          normalized_filters: { date_range: explicit }
      - user: List the first 5 Content permits from the last 7 days.
        expect:
          skill: admin_content_permit_reader
          tool: admin.licensemanagement.get-licensemanagement-content-permit-list
          normalized_filters: { date_range: explicit, limit: 5 }

  - id: content-permit-action-and-aggregate-boundary
    actor: content-manager
    turns:
      - user: Show details for the third Content permit.
        expect:
          clarification_or_gap: aggregate_report_has_no_permit_identifier
          tools: []
      - user: Suspend the first Content permit and download it.
        expect:
          skill: admin_content_read_only_boundary
          tools: []
          mutation: refused

  - id: content-knowledge-report-filters
    actor: content-officer
    requires: [knowledge_source: media_content_reports]
    turns:
      - user: What filters are supported by the Media Content Reports?
        expect:
          skill: admin_content_guidance
          tool: knowledge.search
          citations: required

  - id: content-knowledge-copyright
    actor: content-officer
    requires: [knowledge_source: copyright_regulation]
    turns:
      - user: What information is required for a work-right registration application?
        expect:
          skill: admin_content_guidance
          tool: knowledge.search
          citations: required

  - id: content-hybrid-external-approval-guidance
    actor: content-officer
    requires: [todo_tasks: 1, knowledge_source: external_approval]
    turns:
      - user: List my Content tasks waiting for external approval.
        expect:
          skill: admin_content_task_reader
          tool: admin.content.post-content-mytodopage
          capture: { selected_task: "result_set.items[0]" }
      - user: What does the external approval process require for the first task?
        expect:
          skill: admin_content_task_reader
          tools: [admin.content.get-content-myreviewdetail-taskid, knowledge.search]
          parameters: { taskId: "${selected_task.taskId}" }
          evidence: [live_task_detail, content_knowledge]
          citations: required

  - id: content-write-boundary
    actor: content-officer
    turns:
      - user: Approve the first Content task.
        expect:
          skill: admin_content_read_only_boundary
          tools: []
          mutation: refused

  - id: content-new-conversation-reference-boundary
    actor: content-officer
    turns:
      - user: What about the third one?
        expect:
          clarification: required
          tools: []
