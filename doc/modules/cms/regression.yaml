module: cms
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: cms-news-list-and-ordinal-detail
    actor: cms-staff
    requires: [news: 3]
    turns:
      - user: Show the first 3 CMS news items ordered by last update.
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-news-list
          side_effect: read
          parameters: { pageIndex: 1, pageSize: 3 }
          capture: { third_news: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-news-detail
          side_effect: read
          parameters: { id: "${third_news.id}" }
          masked_fields: [contentEn, contentAr, seodescription, seokeyWords]

  - id: cms-event-list-and-count
    actor: cms-staff
    turns:
      - user: Show the first 3 CMS events from the last 7 days.
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-event-list
          side_effect: read
          parameters: { pageIndex: 1, pageSize: 3, stime: runtime_last_7_days_start, etime: runtime_today }
      - user: How many CMS events are there overall?
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-event-count
          side_effect: read

  - id: cms-job-list-and-detail
    actor: cms-staff
    requires: [jobs: 1]
    turns:
      - user: List the first CMS job opening.
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-job-list
          side_effect: read
          capture: { first_job: "result_set.items[0]" }
      - user: Show its details.
        expect:
          skill: admin_cms_reader
          tool: admin.cms.get-job-detail
          side_effect: read
          parameters: { id: "${first_job.id}" }

  - id: cms-knowledge-guidance
    actor: cms-staff
    requires: [knowledge_source: cms_process]
    turns:
      - user: What is the CMS review and publication process?
        expect:
          skill: admin_cms_guidance
          tool: knowledge.search
          citations: required

  - id: cms-write-boundary
    actor: cms-staff
    turns:
      - user: Publish the first CMS news item and export its content.
        expect:
          skill: admin_cms_read_only_boundary
          tools: []
          mutation: refused
