module: service-reports-analytics
mode: assistant-readonly
actors:
  it-management:
    portal_role: System Administrator
    prerequisites: [Service Reports & Analytics is visible]
cases:
  - id: service-analytics-operations-last-seven-days
    actor: it-management
    turns:
      - user: Show Service Operations Analytics for the last 7 days.
        expect:
          skill: admin_service_analytics_reader
          tool: admin.serviceinfo.get-serviceinfo-dashboard-service-statistics
          side_effect: read
          parameters: [startDate, endDate]
  - id: service-analytics-customer-insights
    actor: it-management
    turns:
      - user: Show Customer Profile Insights for the last 30 days.
        expect:
          tool: admin.serviceinfo.get-serviceinfo-dashboard-customer-statistics
          side_effect: read
  - id: service-analytics-export-boundary
    actor: it-management
    turns:
      - user: Export the Service Operations Analytics report.
        expect:
          skill: admin_service_analytics_read_only_boundary
          no_tool_call: true
