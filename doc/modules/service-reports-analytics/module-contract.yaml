module: service-reports-analytics
mode: assistant-readonly
actor_aliases: [it-management]
intents:
  - id: service-analytics.operations
    skill: admin_service_analytics_reader
    when_use: Read authorized service operations metrics, trends, rankings, and customer-profile insights.
    when_not_use: Do not export reports or modify services, applications, profiles, or analytics settings.
    tools:
      - admin.serviceinfo.get-serviceinfo-dashboard-service-statistics
      - admin.serviceinfo.get-serviceinfo-dashboard-service-list
      - admin.serviceinfo.get-serviceinfo-dashboard-customer-statistics
      - admin.serviceinfo.get-serviceinfo-dashboard-customer-list
    parameters: [date_range, keyword, limit, sort, service_scope, department]
    side_effect: read
  - id: service-analytics.guidance
    skill: admin_service_analytics_guidance
    tools: [knowledge.search]
    knowledge_scope: [service-management]
    citations_required: true
  - id: service-analytics.actions.refuse
    skill: admin_service_analytics_read_only_boundary
    tools: []
    side_effect: none
