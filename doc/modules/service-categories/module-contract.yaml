module: service-categories
mode: assistant-readonly
actor_aliases: [it-management]
intents:
  - id: service-categories.query
    skill: admin_service_category_reader
    when_use: Read authorized service categories, search results, ordering, service totals, and selected category details.
    when_not_use: Do not add, edit, reorder, or delete categories.
    tools: [admin.servicecategories.get-servicecategories-pagelist, admin.servicecategories.get-servicecategories-id]
    parameters: [search, limit, sort, selection]
    side_effect: read
  - id: service-categories.guidance
    skill: admin_service_category_guidance
    tools: [knowledge.search]
    knowledge_scope: [service-management]
    citations_required: true
  - id: service-categories.actions.refuse
    skill: admin_service_category_read_only_boundary
    tools: []
    side_effect: none
