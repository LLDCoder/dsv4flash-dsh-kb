module: message-templates
portal: admin
mode: assistant-readonly
actor_aliases: [it-management]
sources:
  portal_routes: [/communications/message-templates]
  read_endpoints:
    - /api/SignalR/GetTemplateList
    - /api/SignalR/GetTemplateById
skills:
  - id: admin_message_template_reader
    use_when: authorized message-template lists, counts from list metadata, filters, and a selected template's safe metadata
    not_when: broadcast records, policy-only guidance, or a request to create, edit, publish, send, test, delete, export, or otherwise change a template
    tools: [admin.communications.post-template-list, admin.communications.get-template-detail]
    parameters: [keyword, status, channel, portal, user_type, department, date_range, limit, selection]
    side_effect: read
  - id: admin_message_template_guidance
    use_when: cited communication-template process or policy guidance with authoritative source evidence
    not_when: live templates or a requested business action
    tools: [knowledge.search]
    citations_required: true
  - id: admin_message_template_read_only_boundary
    use_when: requests to create, edit, publish, unpublish, send, test, duplicate, delete, export, download, or upload a message template
    not_when: read-only lists, selected metadata, or cited guidance
    tools: []
data_boundary:
  - Template bodies, subjects, recipient scopes, and channels are masked in the selected-detail Tool result.
  - The configured reader fixes the shared endpoint type to template; it does not infer broadcast visibility.
