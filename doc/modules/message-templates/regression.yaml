module: message-templates
portal: admin
mode: assistant-readonly
concurrency: 4
cases:
  - id: message-template-list-and-ordinal-detail
    actor: it-management
    requires: [templates: 3]
    turns:
      - user: Show the first 3 message templates.
        expect:
          skill: admin_message_template_reader
          tool: admin.communications.post-template-list
          side_effect: read
          parameters: { type: "1", pageIndex: 1, pageSize: 3 }
          capture: { third_template: "result_set.items[2]" }
      - user: What about the third one?
        expect:
          skill: admin_message_template_reader
          tool: admin.communications.get-template-detail
          side_effect: read
          parameters: { id: "${third_template.id}", type: "1" }
          masked_fields: [emailBodyEn, emailBodyAr, smsen, smsar, inAppMessageEn, inAppMessageAr, recipients]
  - id: message-template-write-boundary
    actor: it-management
    turns:
      - user: Publish and send the first message template, then export it.
        expect:
          skill: admin_message_template_read_only_boundary
          tools: []
          mutation: refused
