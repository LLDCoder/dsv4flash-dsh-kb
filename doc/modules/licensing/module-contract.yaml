module: licensing
portal: admin
mode: assistant-readonly
sources:
  portal_pages: [/licensing/applications, /licensing/licenses]
  knowledge_folder: /umc
roles:
  - actor: licensing-officer
    portal_role: Licensing Officer
    verified_access: [application_tasks, profile_verification, licenses, analytics, reports]
intents:
  - id: admin_licensing_task_reader
    when_use: Read authorized Licensing application-task lists with status, date, keyword, and limit filters.
    when_not_use: Do not use for Profile verification, issued licenses, policy-only guidance, or requested business actions.
    tools: [admin.application.post-application-mytodopage]
    filters: [keyword, statuses, date_range, limit]
    side_effect: read
  - id: admin_licensing_application_reader
    when_use: Read an authorized Licensing application review detail from a supplied or selected task identifier.
    when_not_use: Do not use for list, analytics, guidance, or requested approval changes.
    tools: [admin.application.get-application-myreviewdetail-taskid]
    side_effect: read
  - id: admin_licensing_profile_reader
    when_use: Read authorized Profile verification tasks and their status, profile type, date, and ownership filters.
    when_not_use: Do not use for issued license records or requested verification decisions.
    tools: [admin.licensing.profile-tasks.list]
    filters: [application_no, status_id, user_type_ids, date_range, mine_only, limit]
    side_effect: read
  - id: admin_licensing_license_reader
    when_use: Read authorized issued-license lists or a selected license detail, including issuance, expiry, status, and keyword filters.
    when_not_use: Do not use for application tasks, policy-only guidance, or a requested license change, export, or download.
    tools:
      - admin.licensemanagement.post-licensemanagement-list
      - admin.licensemanagement.get-licensemanagement-id
    filters: [keyword, status, issuance_date, expiry_date, limit]
    side_effect: read
  - id: admin_licensing_operational_summary_reader
    when_use: Read current Licensing workload summaries and prioritized attention items.
    when_not_use: Do not use for cross-module aggregation or business actions.
    tools:
      - admin.application.get-application-dashboard-statistics
      - admin.licensedashboard.get-license-dashboard-needs-attention
    side_effect: read
  - id: admin_licensing_sla_reader
    when_use: Read urgent or overdue Licensing work from the authorized urgency or task feed.
    when_not_use: Do not assign, escalate, or modify a task.
    tools:
      - admin.licensedashboard.get-license-dashboard-needs-attention
      - admin.application.post-application-mytodopage
    filters: [statuses, date_range, limit]
    side_effect: read
  - id: admin_licensing_analytics_reader
    when_use: Read application, license, and service-performance analytics for the authorized scope.
    when_not_use: Do not infer a reporting period that the selected Tool does not support.
    tools:
      - admin.application.get-application-dashboard-statistics
      - admin.licensemanagement.get-licensemanagement-dashboard-statistics
      - admin.licensemanagement.get-licensemanagement-dashboard-report
    filters: [date_range, days, keyword, limit]
    side_effect: read
  - id: admin_licensing_report_reader
    when_use: Read the service-performance report preview.
    when_not_use: Do not create an export or substitute an unavailable export-only report with fabricated data.
    tools: [admin.licensemanagement.get-licensemanagement-dashboard-report]
    filters: [date_range, keyword, limit]
    side_effect: read
  - id: admin_licensing_guidance
    when_use: Answer Licensing process, requirement, or material questions using cited authoritative knowledge.
    when_not_use: The request needs live record data, requests an action, or lacks a relevant source.
    tools: [knowledge.search]
    knowledge_scope: [/umc]
    citations_required: true
    side_effect: read
  - id: admin_licensing_read_only_boundary
    when_use: Refuse approval, rejection, suspension, renewal, export, download, upload, deletion, or another Licensing business action.
    when_not_use: The request is only an authorized read-only lookup or cited guidance.
    tools: []
    side_effect: none
known_gaps:
  - id: LIC-02
    description: Final Approval task filtering requires live role evidence; historical test fell back during router unavailability.
  - id: LIC-13
    description: Monthly expiry filtering requires live role evidence; historical test fell back during router timeout.
