module: customer-management
portal: admin
mode: assistant-readonly
sources:
  portal_routes: [/happiness/customerManagement]
  knowledge_folder: /umc
roles:
  - actor: happiness-leader
    portal_role: Happiness Center Manager
    verified_access: [customer_accounts, customer_profiles]
intents:
  - id: admin_customer_management_reader
    when_use: Read authorized Customer Management account or Profile counts, filtered lists, a selected Profile summary, or related-record summary.
    when_not_use: Do not use for Licensing profile-verification tasks, Customer Happiness cases, raw personal data, policy-only guidance, or any requested business action.
    tools:
      - admin.usermanagement.get-usermanagement-getcustomerinfocountdto
      - admin.usermanagement.get-usermanagement-getcustomerusersasync
      - admin.usermanagement.get-usermanagement-getprofilecount
      - admin.usermanagement.get-usermanagement-getprofilelist
      - admin.usermanagement.get-usermanagement-userprofileid-profileandapplicant
      - admin.usermanagement.get-usermanagement-userprofileid-relate
    filters: [keyword, date_range, profile_status, profile_type, limit]
    selection:
      source_tool: admin.usermanagement.get-usermanagement-getprofilelist
      value_field: profileId
      supports_ordinals: true
    side_effect: read
    response_boundary:
      - Expose only the Tool-masked operational summary fields.
      - Keep stable internal identifiers in the selection snapshot only; do not present them as customer-facing data.
      - Do not expose names, email addresses, phone numbers, government identifiers, document or photo URLs, license numbers, certificate numbers, or account/Profile numbers.
  - id: admin_customer_management_guidance
    when_use: Answer Customer Management procedure or Profile-state questions with authoritative, cited knowledge evidence.
    when_not_use: The request needs current account or Profile facts, has no retrievable source, or asks for an action.
    tools: [knowledge.search]
    knowledge_scope: [/umc]
    citations_required: true
    side_effect: read
  - id: admin_customer_management_read_only_boundary
    when_use: Refuse account/Profile activation, deactivation, approval, verification, impersonation, communication, reset, export, download, upload, deletion, merge, or other business change.
    when_not_use: The request is only a masked, read-only account/Profile lookup or cited guidance.
    tools: []
    side_effect: none
known_gaps:
  - id: CM-01
    description: Customer Management guidance uses the shared /umc folder; a dedicated authoritative Profile-policy source has not yet been verified.
    impact: Record lookup and action-boundary cases are verified. Knowledge cases require a source-relevance check before acceptance.
