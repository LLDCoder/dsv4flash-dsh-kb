module: dashboard-my-tasks
portal: admin
mode: assistant-readonly
intent:
  id: admin_dashboard_my_tasks
  name: Licensing Dashboard My Tasks reader
  use_when: Read the authenticated Licensing user's unqualified current tasks or My Tasks overview, including questions such as What tasks do I currently need to complete?
  do_not_use_when: A different department is explicitly named, the request is for another Dashboard section, or the user asks to approve, assign, reassign, transfer, resolve, export, download, upload, delete, or otherwise change a task.
  tool: admin.licensedashboard.get-license-dashboard-overview
  side_effect: read
  profile_scope: token_scoped
workflow:
  default_intent: overview
  overview:
    task_category: 0
    response_fields: [taskTabCounts, priorityCards]
  category_follow_up:
    task_category:
      service_application: 0
      profile_verification: 1
      enquiries: 2
      refunds: 3
      appeals: 4
    response_fields: [priorityCards]
scope_boundary:
  - An unqualified question returns every Task tab count from taskTabCounts and may present the default Service Application priorityCards separately.
  - A category named in the next turn keeps the authenticated user's Licensing scope and requests only that category's priorityCards.
  - Report only the returned authorized counts and cards. An empty or forbidden result is not replaced with generic knowledge or another department's data.
