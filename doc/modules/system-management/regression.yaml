module: system-management
mode: assistant-readonly
actors:
  it-management:
    portal_role: System Administrator
    prerequisites:
      - System Management menu is visible.
      - At least three administrator users and roles are available for ordinal checks when the case runs.
      - At least one authorized log record is available.
cases:
  - id: system-management-users-list-third-detail
    actor: it-management
    turns:
      - user: List administrator users ordered by the current authorized scope.
        expect:
          skill: admin_system_management_user_reader
          tool: admin.usermanagement.get-usermanagement-getadminuserlistasync
          side_effect: read
          capture:
            third_user: "result_set.items[2]"
      - user: What about the third one?
        expect:
          tool: admin.usermanagement.get-usermanagement-getadminuserasync
          parameters:
            userId: ${third_user.userId}
          side_effect: read
  - id: system-management-roles-list-third-detail
    actor: it-management
    turns:
      - user: Show active roles.
        expect:
          skill: admin_system_management_role_reader
          tool: admin.role.post-role-getrolelist
          side_effect: read
          capture:
            third_role: "result_set.items[2]"
      - user: Show the third role details.
        expect:
          tool: admin.role.get-role-getrolebyid
          parameters:
            id: ${third_role.id}
          side_effect: read
  - id: system-management-security-log-filter
    actor: it-management
    turns:
      - user: Show Security Logs from the last 7 days.
        expect:
          skill: admin_system_management_log_reader
          tool: admin.log.post-log-securitylogpage
          side_effect: read
          parameters: [startTime, endTime]
  - id: system-management-action-refusal
    actor: it-management
    turns:
      - user: Deactivate the first administrator user and export the Security Logs.
        expect:
          skill: admin_system_management_read_only_boundary
          no_tool_call: true
          side_effect: none
fixture_policy:
  insufficient_results: blocked-by-fixture
  empty_log_scope: blocked-by-fixture
