<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH · 会话记录</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="loginGate" class="gate">
      <form id="loginForm" class="gate-card">
        <p class="eyebrow">DSH · KNOWLEDGE BASE SERVICE</p>
        <h1>会话记录</h1>
        <p class="muted">登录后管理会话，并查看知识库问答的实时输出。</p>
        <label>控制台密码<input id="password" type="password" required autocomplete="current-password" autofocus /></label>
        <button type="submit">进入会话工作台</button>
        <p id="loginStatus" class="notice" role="alert"></p>
      </form>
    </section>

    <main id="workspace" class="workspace" hidden>
      <header class="topbar">
        <div><p class="eyebrow">DSH · KNOWLEDGE BASE SERVICE</p><h1>会话记录</h1><p class="muted">集中查看问题、回答和流式输出；仅连接知识库，不使用 UMC 自动登录。</p></div>
        <div class="top-actions"><span id="modePill" class="pill">KB-only</span><button id="logoutBtn" class="secondary" type="button">退出</button></div>
      </header>

      <section class="toolbar card">
        <label>用户 ID<input id="userId" value="demo-user" /></label>
        <label>租户 ID<input id="tenantId" value="kb-only" /></label>
        <button id="refreshBtn" class="secondary" type="button">刷新会话</button>
        <button id="newBtn" type="button">新建会话</button>
        <span id="status" class="muted" role="status"></span>
      </section>

      <section class="layout">
        <aside class="session-column card">
          <div class="section-head"><div><h2>会话</h2><span id="count" class="muted"></span></div><button id="newSmallBtn" class="secondary compact" type="button">新建</button></div>
          <input id="search" class="search" type="search" placeholder="搜索会话标题或问题" />
          <div id="sessionList" class="session-list"><div class="empty">正在读取会话…</div></div>
        </aside>

        <section class="conversation card">
          <div id="emptyDetail" class="empty detail-empty">选择一个会话，查看问题和回答。</div>
          <div id="detail" hidden>
            <div class="detail-head">
              <div><input id="titleInput" class="title-input" aria-label="会话标题" /><code id="conversationId"></code></div>
              <div class="detail-actions"><button id="saveTitleBtn" class="secondary" type="button">保存标题</button><button id="deleteBtn" class="danger" type="button">删除会话</button></div>
            </div>
            <div id="messages" class="messages"></div>
            <div id="streamStatus" class="stream-status" aria-live="polite"></div>
            <form id="messageForm" class="composer"><textarea id="message" rows="3" placeholder="输入问题，回答将实时显示…" required></textarea><button id="sendBtn" type="submit">发送问题</button></form>
          </div>
        </section>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
