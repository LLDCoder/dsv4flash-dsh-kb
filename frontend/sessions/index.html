<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH · 会话记录</title>
    <link rel="icon" type="image/svg+xml" href="chat-favicon.svg?v=2" />
    <link rel="stylesheet" href="styles.css?v=20260920-attachments" />
  </head>
  <body>
    <main id="workspace" class="workspace">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✦</span><div><p class="eyebrow">DSH · KNOWLEDGE BASE SERVICE</p><h1>知识库问答工作台</h1><p class="muted">仅连接知识库，实时查看问题、回答与检索过程。</p></div></div>
        <div class="top-actions"><span id="modePill" class="pill"><span class="status-dot"></span>知识库已连接</span><span class="top-chip">KB-ONLY</span></div>
      </header>

      <section class="toolbar card">
        <div class="toolbar-intro"><span class="toolbar-icon">✦</span><div><strong>知识库问答工作台</strong><span>问题、回答与流式检索结果集中管理</span></div></div>
        <div class="toolbar-actions"><span id="status" class="muted" role="status"></span><button id="refreshBtn" class="secondary" type="button">刷新</button><button id="newBtn" type="button">新建会话</button></div>
      </section>

      <section class="layout">
        <aside class="session-column card">
          <div class="section-head"><div><h2>会话</h2><span id="count" class="muted"></span></div><button id="newSmallBtn" class="secondary compact" type="button">新建</button></div>
          <input id="search" class="search" type="search" placeholder="搜索会话标题或问题" />
          <div id="sessionList" class="session-list"><div class="empty">正在读取会话…</div></div>
        </aside>

        <section class="conversation card">
          <div id="emptyDetail" class="empty detail-empty">选择一个会话，查看问题和回答。</div>
          <div id="detail" hidden>
            <div class="detail-head">
              <div><input id="titleInput" class="title-input" aria-label="会话标题" /><code id="conversationId"></code></div>
              <div class="detail-actions"><button id="saveTitleBtn" class="secondary" type="button">保存标题</button><button id="deleteBtn" class="danger" type="button">删除会话</button></div>
            </div>
            <div id="messages" class="messages"></div>
            <div id="streamStatus" class="stream-status" aria-live="polite"><span id="streamStatusText"></span><span id="loadingDots" class="loading-dots" hidden aria-label="正在处理"><i></i><i></i><i></i></span></div>
            <form id="messageForm" class="composer">
              <div class="composer-main"><textarea id="message" rows="3" placeholder="输入问题，回答将实时显示…"></textarea><div id="attachmentPreview" class="attachment-preview" hidden><span class="attachment-icon">↗</span><span id="attachmentName"></span><button id="clearAttachmentBtn" type="button" class="attachment-clear" aria-label="移除附件">×</button></div></div>
              <div class="composer-actions"><input id="attachmentPicker" class="file-picker" type="file" accept=".pdf,image/*" /><button id="attachBtn" type="button" class="secondary attach-button">附件</button><button id="sendBtn" type="submit">发送问题</button></div>
            </form>
          </div>
        </section>
      </section>
    </main>
    <script src="app.js?v=20260920-attachments" type="module"></script>
  </body>
</html>
