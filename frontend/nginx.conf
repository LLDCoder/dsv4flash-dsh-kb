server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /healthz {
    proxy_pass http://backend:8000;
  }

  # Keep the UMC upload call same-origin for the local test console. The
  # upstream requires the caller's UMC Bearer token and accepts multipart
  # field `file`; the proxy avoids browser CORS restrictions.
  location /umc-api/ {
    proxy_pass http://77.242.240.158:18085/api/;
    proxy_http_version 1.1;
    proxy_set_header Host 77.242.240.158:18085;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    client_max_body_size 20m;
  }

  location / { try_files $uri /index.html; }
}
