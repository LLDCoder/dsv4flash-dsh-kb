<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, max-age=0, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-arabic-title="الخدمات الإلكترونية - الهيئة الوطنية للإعلام">Services - National Media Authority</title>
    <script id="initial-title">
      (function () {
        var title = document.querySelector("title");
        if (!title) {
          return;
        }

        try {
          var savedLanguage = window.localStorage.getItem("language");
          if (String(savedLanguage || "").toLowerCase().startsWith("ar")) {
            document.title = title.dataset.arabicTitle || document.title;
          }
        } catch (error) {
          // Storage access can be blocked by browser privacy settings.
        }
      })();
    </script>
    <script>
      (function () {
        var reloadParam = "__app_reload";
        var reloadKey = "customer-portal:asset-reload-at";
        var reloadCooldownMs = 10000;
        var lastReloadFromUrl = 0;
        var staleAssetPattern =
          /(Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Loading chunk [A-Za-z0-9_-]+ failed|ChunkLoadError)/i;

        function normalizeUrlForHistory(url) {
          return url.pathname + url.search + url.hash;
        }

        function cleanupReloadParam() {
          var currentUrl = new URL(window.location.href);
          if (!currentUrl.searchParams.has(reloadParam)) {
            return;
          }

          lastReloadFromUrl = Number(currentUrl.searchParams.get(reloadParam) || 0);
          currentUrl.searchParams.delete(reloadParam);
          window.history.replaceState(null, "", normalizeUrlForHistory(currentUrl));
        }

        function isAssetRequestUrl(url) {
          return /\/assets\/.+\.(?:js|css)(?:$|\?)/i.test(String(url || ""));
        }

        function readLastReloadAt() {
          try {
            return Number(sessionStorage.getItem(reloadKey) || 0) || lastReloadFromUrl;
          } catch (error) {
            return lastReloadFromUrl;
          }
        }

        function writeLastReloadAt(now) {
          lastReloadFromUrl = now;
          try {
            sessionStorage.setItem(reloadKey, String(now));
          } catch (error) {
            // Storage access can be blocked by browser privacy settings.
          }
        }

        function shouldReload(now) {
          var lastReloadAt = readLastReloadAt();
          return now - lastReloadAt > reloadCooldownMs;
        }

        function triggerReload(reason, event) {
          var now = Date.now();
          if (!shouldReload(now)) {
            return;
          }

          if (event && typeof event.preventDefault === "function") {
            event.preventDefault();
          }

          writeLastReloadAt(now);

          if (window.console && typeof window.console.warn === "function") {
            window.console.warn("[asset-reload]", reason);
          }

          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set(reloadParam, String(now));
          window.location.replace(nextUrl.toString());
        }

        function handleDynamicImportFailure(message, event) {
          if (!message) {
            return;
          }

          if (staleAssetPattern.test(message)) {
            triggerReload(message, event);
          }
        }

        cleanupReloadParam();

        window.addEventListener("vite:preloadError", function (event) {
          var message =
            String(
              (event && event.payload && event.payload.message) ||
                (event && event.reason && event.reason.message) ||
                (event && event.message) ||
                "vite:preloadError"
            );
          triggerReload(message, event);
        });

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (target && target !== window) {
              var assetUrl = target.src || target.href || "";
              if (isAssetRequestUrl(assetUrl)) {
                triggerReload(assetUrl, event);
                return;
              }
            }

            var message = String(
              (event && event.message) || (event && event.error && event.error.message) || ""
            );
            handleDynamicImportFailure(message, event);
          },
          true
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message = "";

          if (typeof reason === "string") {
            message = reason;
          } else if (reason && typeof reason.message === "string") {
            message = reason.message;
          } else if (reason && typeof reason.stack === "string") {
            message = reason.stack;
          }

          handleDynamicImportFailure(String(message || ""), event);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
